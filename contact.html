<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<script>
    document.getElementById("contact-form").addEventListener("submit", function () {
        const onderwerp = document.getElementById("onderwerp").value.trim();

        document.getElementById("mail-subject").value =
            "[Kunsd Website] " + onderwerp;
    });
</script>

<body>

<header>
    <nav>
        <a href="index.html">Home</a>
        <a href="over-mij.html">Over mij</a>
        <a href="kunst.html">Kunsd</a>
        <a href="jouw_kunst.html">Jouw kunsd</a>
        <a href="muziek.html">Muziek</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>

    <h1>Contact</h1>

    <p>
        Ideeën, feedback, vragen of opmerkingen zijn altijd welkom.
    </p>

    <p>
        🚧 Dit werkt momenteel niet, dus als je me wilt bereiken kan je ook gewoon mailen: <span class="email-address">jjmetz0@gmail.com</span>
    </p>

    <form action="https://api.web3forms.com/submit" method="POST" id="contact-form">

        <!-- Vervang dit door de access key die je per mail van Web3Forms krijgt -->
        <input
            type="hidden"
            name="access_key"
            value="73e4fdaa-9b3e-40c7-add5-1553a9fb5971"
        >

        <!-- Onderwerp van de mail die je zelf ontvangt -->
        <input
            type="hidden"
            id="mail-subject"
            name="subject"
            value="[Kunsd Website]"
        >

        <!-- Bezoeker komt hierna op de bedankpagina terecht -->
        <input
            type="hidden"
            name="redirect"
            value="https://jesses-kunsd.onrender.com/bedankt.html"
        >

        <!-- Spamfilter: moet leeg blijven, bots vullen dit vaak wel in -->
        <input
            type="checkbox"
            name="botcheck"
            style="display: none;"
            tabindex="-1"
            autocomplete="off"
        >

        <p>
            <label for="onderwerp">
                Onderwerp
            </label>
            <br>

            <input
                type="text"
                id="onderwerp"
                name="onderwerp"
                required
            >
        </p>

        <p>
            <label for="email">
                Je e-mailadres
            </label>
            <br>

            <input
                type="email"
                id="email"
                name="email"
                required
            >
        </p>

        <p>
            <label for="message">
                Bericht
            </label>
            <br>

            <textarea
                id="message"
                name="message"
                rows="10"
                required
            ></textarea>
        </p>

        <button
            type="submit"
            class="create-button"
        >
            Verzenden
        </button>

    </form>

</main>

</body>
</html>
