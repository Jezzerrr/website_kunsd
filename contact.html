<main>

    <h1>Contact</h1>

    <p>
        Ideeën, feedback, vragen of opmerkingen zijn altijd welkom.
    </p>

    <p>
        🚧 Dit werkt momenteel niet, dus als je me wilt bereiken kan je ook gewoon mailen: <span class="email-address">jjmetz0@gmail.com</span>
    </p>

    <form action="https://formsubmit.co/jjmetz0@gmail.com" method="POST">

        <input
            type="hidden"
            name="_subject"
            value="Nieuw bericht vanaf KUNSD website"
        >

        <input
            type="hidden"
            name="_captcha"
            value="false"
        >

        <input
            type="hidden"
            name="_template"
            value="table"
        >
<!--        <input type="text" name="_honey" style="display:none">-->
<!--        <input type="hidden" name="_next" value="https://jouw-site.onrender.com/bedankt.html">-->
<!--        <input-->
<!--            type="hidden"-->
<!--            name="_next"-->
<!--            value="https://jesses-kunsd.onrender.com/contact.html"-->
<!--        >-->


        <p>
            <label for="subject">
                Onderwerp
            </label>
            <br>

            <input
                type="text"
                id="subject"
                name="subject"
                required
            >
        </p>

        <p>
            <label for="email">
                Je e-mailadres
            </label>
            <br>

            <input
                type="email"
                id="email"
                name="email"
                required
            >
        </p>

        <p>
            <label for="message">
                Bericht
            </label>
            <br>

            <textarea
                id="message"
                name="message"
                rows="10"
                required
            ></textarea>
        </p>

        <button
            type="submit"
            class="create-button"
        >
            Verzenden
        </button>

    </form>

</main>

</body>
