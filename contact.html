<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <!-- Favicon (icoontje in het browsertabblad) -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/mijn_kunsd/delen/favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/mijn_kunsd/delen/favicon/apple-touch-icon.png">

    <!-- Deel-tags: titel, tekst en plaatje bij een gedeelde link (WhatsApp, Signal, LinkedIn, ...) -->
    <meta name="description" content="Neem contact op met Jesse over KUNSD, de website waar je kunst maakt van je eigen foto, of een kleurplaat print om zelf mee aan de slag te gaan.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="KUNSD">
    <meta property="og:locale" content="nl_NL">
    <meta property="og:url" content="https://jesses-kunsd.onrender.com/contact">
    <meta property="og:title" content="Contact - KUNSD">
    <meta property="og:description" content="Neem contact op met Jesse over KUNSD, de website waar je kunst maakt van je eigen foto, of een kleurplaat print om zelf mee aan de slag te gaan.">
    <meta property="og:image" content="https://jesses-kunsd.onrender.com/mijn_kunsd/delen/deel_afbeelding.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="KUNSD: maak kunst van je eigen foto, met een kleurrijk abstract portret en een foto van Jesse">
    <meta name="twitter:card" content="summary_large_image">
</head>

<body>

<header>
    <nav>
        <a href="/">Home</a>
        <a href="/jouw_kunst">Jouw Kunsd</a>
        <a href="/mijn_kunst">Mijn Kunsd</a>
        <a href="/contact">Contact</a>
    </nav>
</header>

<main>

    <h1>Contact</h1>

    <p>
        Zin om te sparren? Over kunst, nieuwe mogelijkheden of websites bouwen: ideeën, feedback en vragen zijn altijd welkom.
    </p>

    <form action="https://api.web3forms.com/submit" method="POST" id="contact-form">

        <input
            type="hidden"
            name="access_key"
            value="73e4fdaa-9b3e-40c7-add5-1553a9fb5971"
        >

        <!-- Onderwerp van de mail die je zelf ontvangt -->
        <input
            type="hidden"
            id="mail-subject"
            name="subject"
            value="[Kunsd Website]"
        >

        <!-- Bezoeker komt hierna op de bedankpagina terecht -->
        <input
            type="hidden"
            name="redirect"
            value="https://jesses-kunsd.onrender.com/bedankt"
        >

        <!-- Spamfilter: moet leeg blijven, bots vullen dit vaak wel in -->
        <input
            type="checkbox"
            name="botcheck"
            style="display: none;"
            tabindex="-1"
            autocomplete="off"
        >

        <p>
            <label for="onderwerp">
                Onderwerp
            </label>
            <br>

            <input
                type="text"
                id="onderwerp"
                name="onderwerp"
                required
            >
        </p>

        <p>
            <label for="email">
                Je e-mailadres
            </label>
            <br>

            <input
                type="email"
                id="email"
                name="email"
                required
            >
        </p>

        <p>
            <label for="message">
                Bericht
            </label>
            <br>

            <textarea
                id="message"
                name="message"
                rows="10"
                required
            ></textarea>
        </p>

        <button
            type="submit"
            class="create-button"
        >
            Verzenden
        </button>

    </form>

</main>

<script>
    document.getElementById("contact-form").addEventListener("submit", function () {
        const onderwerp = document.getElementById("onderwerp").value.trim();

        document.getElementById("mail-subject").value =
            "[Kunsd Website] " + onderwerp;
    });
</script>

<script src="js/analytics.js"></script>
<script data-goatcounter="https://jessekunsd.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

</body>
</html>
